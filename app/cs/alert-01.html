<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>투자기업관리플랫폼</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://youmm0522.github.io/techfin-static/static/cms-monitoring/css/index.css" />
  </head>
  <body>
    <div class="alert-root" role="alertdialog" aria-modal="true" aria-labelledby="alert-title-01">
      <div class="alert-backdrop" aria-hidden="true"></div>
      <div class="alert-box" role="document">
        <div class="alert-contents">
          <div class="alert-icons" aria-hidden="true">
            <i class="icon-comm i--err t--alert"></i>
          </div>
          <div class="alert-msg">
            <p id="alert-title-01">
              문의 등록을 취소하시겠습니까?
            </p>
          </div>
        </div>
        <div class="alert-action">
          <button type="button" class="btn-comm" aria-label="문의 등록 취소">
            <span>등록취소</span>
          </button>
          <button type="button" class="btn-contained" aria-label="문의 등록 계속하기">
            <span>계속하기</span>
          </button>
        </div>
      </div>
    </div>
    <!-- //alert-root -->
  </body>
</html>
